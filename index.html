<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--stroke:rgba(255,255,255,.26);--hi:rgba(255,255,255,.45);--a:#ff8a3d;--b:#ff2e63}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,system-ui,sans-serif;color:#fff;min-height:100vh;background:#0b0712;padding:env(safe-area-inset-top) 0 calc(120px + env(safe-area-inset-bottom));overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 15% 10%,#ff2e63 0,transparent 70%),radial-gradient(55% 45% at 90% 35%,#ff8a3d 0,transparent 70%),radial-gradient(60% 50% at 40% 100%,#5b3cff 0,transparent 70%),#0b0712;opacity:.85}
.glass{position:relative;margin:12px 16px;padding:18px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.05));backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.08),0 16px 40px rgba(0,0,0,.28)}
.glass.sm{border-radius:22px;margin:8px 0;padding:14px}
h1{font-size:30px;font-weight:900;margin:6px 0}
h2{font-size:24px;font-weight:900}
h3{font-size:18px;font-weight:700;margin-bottom:8px}
h4{font-size:15px;font-weight:700;margin-bottom:6px;opacity:.9}
p{margin:4px 0;line-height:1.6}
.muted{opacity:.7;font-size:14px}
.top{padding:24px 20px 4px;font-size:14px;opacity:.75}
input,select{width:100%;padding:14px 16px;margin:6px 0;border-radius:18px;border:1px solid var(--stroke);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:16px;outline:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
input::placeholder{color:rgba(255,255,255,.6)}
select option{color:#000}
input:focus,select:focus{border-color:rgba(255,255,255,.7);box-shadow:0 0 0 3px rgba(255,138,61,.35)}
.btn{display:block;width:100%;margin-top:8px;padding:15px;border:0;border-radius:20px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 26px rgba(255,46,99,.4);cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 var(--hi)}
.item{cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.98)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;background:rgba(255,255,255,.2);margin-inline-start:6px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teams .glass.sm{margin:0}
.back{background:none;border:0;color:#fff;font:inherit;font-size:17px;padding:14px 20px;cursor:pointer}
#msgs{max-height:300px;overflow-y:auto;padding:4px 0}
.msg{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 14px;margin:6px 0}
.msg b{color:#ffd1a8}
#tabbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:7px;border-radius:34px;background:rgba(255,255,255,.14);backdrop-filter:blur(34px) saturate(200%);-webkit-backdrop-filter:blur(34px) saturate(200%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi),0 16px 40px rgba(0,0,0,.4);z-index:10}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:86px;padding:9px 14px;border:0;border-radius:26px;background:none;color:#fff;font:inherit;font-size:21px;opacity:.6;cursor:pointer}
.tb small{font-size:12px}
.tb.on{opacity:1;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 var(--hi)}
.empty{text-align:center;padding:24px 0}
</style>
</head>
<body>
<div class="bg"></div>
<div id="app"></div>
<p style="text-align:center;opacity:.55;font-size:13px;margin-top:10px">by apex¿!hz™</p>
<nav id="tabbar" style="display:none">
  <button class="tb" data-act="tab" data-tab="t">🏆<small>البطولات</small></button>
  <button class="tb" data-act="tab" data-tab="c">🛡️<small>الكلانات</small></button>
  <button class="tb" data-act="tab" data-tab="p">👤<small>حسابي</small></button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ==== 1) ضع إعدادات مشروعك من Firebase هنا ==== */
const firebaseConfig = {
  apiKey: "AIzaSyB8U7K1TZad113atUQjcEfmbZRpNS6QqJ0",
  authDomain: "tournoi-1dcc5.firebaseapp.com",
  projectId: "tournoi-1dcc5",
  storageBucket: "tournoi-1dcc5.firebasestorage.app",
  messagingSenderId: "304672791808",
  appId: "1:304672791808:web:b2fb2b1d817aa85ff8a7e5"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;

/* ==== 2) الحالة ==== */
const app = document.getElementById('app');
const view = { tab: 't', detail: null };
let me = null;
let unsubs = [];
const clearL = () => { unsubs.forEach(f => f()); unsubs = []; };
const listen = (ref, fn) => unsubs.push(ref.onSnapshot(fn));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newCode = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toast = msg => showToast(msg);

/* ==== 3) تسجيل الدخول: يبقى محفوظاً حتى بعد حذف التطبيق ==== */
auth.onAuthStateChanged(u => { me = u; view.detail = null; render(); });

/* ==== 4) العرض الرئيسي ==== */
function render() {
  clearL();
  if (!me) {
    document.getElementById('tabbar').style.display = 'none';
    app.innerHTML = `<div class="glass"><h1 class="center">🔥 تنظيم فري فاير</h1>
      <p class="muted center">أنشئ بطولاتك وكلاناتك وانضم لأصدقائك بكود بسيط</p>
      <input id="nm" placeholder="الاسم (للتسجيل فقط)" maxlength="30">
      <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
      <input id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="current-password">
      <button class="btn" data-act="login">تسجيل الدخول</button>
      <button class="btn ghost" data-act="register">إنشاء حساب جديد</button></div>`;
    return;
  }
  document.getElementById('tabbar').style.display = 'flex';
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.tab === view.tab));
  if (view.detail) return view.detail.type === 't' ? tDetail(view.detail.id) : cDetail(view.detail.id);
  if (view.tab === 't') return tournamentsView();
  if (view.tab === 'c') return clansView();
  return profileView();
}

/* ==== 5) البطولات ==== */
function tournamentsView() {
  app.innerHTML = `<div class="top">مرحباً ${esc(me.displayName || '')}</div>
    <div class="glass"><h3>بطولة جديدة</h3>
      <input id="tn" placeholder="اسم البطولة" maxlength="40">
      <input id="tm" type="number" min="4" max="12" value="12" placeholder="عدد اللاعبين (4 - 12)">
      <button class="btn" data-act="createT">إنشاء البطولة</button></div>
    <div class="glass"><h3>انضم بالكود</h3>
      <input id="jc" placeholder="كود البطولة" maxlength="6">
      <button class="btn ghost" data-act="joinT">انضم</button></div>
    <div id="list" style="padding:0 0 8px"></div>`;
  listen(db.collection('tournaments').where('uids', 'array-contains', me.uid), s => {
    const list = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const el = document.getElementById('list');
    if (!el) return;
    el.innerHTML = list.length
      ? list.map(t => `<div class="glass item" data-act="openT" data-id="${esc(t.id)}">
          <h3>${esc(t.name)}</h3>
          <span class="badge">${t.uids.length}/${t.max} لاعب</span>
          <span class="badge">كود: ${esc(t.id)}</span>
          ${t.teams ? '<span class="badge">تم توزيع الفرق</span>' : ''}</div>`).join('')
      : `<div class="glass empty muted">لا توجد بطولات بعد. أنشئ واحدة أو انضم بكود.</div>`;
  });
}

function tDetail(id) {
  listen(db.collection('tournaments').doc(id), s => {
    const t = s.data();
    if (!t) { app.innerHTML = `<button class="back" data-act="back">‹ رجوع</button><div class="glass empty">البطولة غير موجودة</div>`; return; }
    const isOwner = t.owner === me.uid;
    const full = t.uids.length >= t.max;
    const joined = t.uids.includes(me.uid);
    const teamsHTML = t.teams ? `<h4 style="margin-top:14px">الفرق (${t.teams.A.length} ضد ${t.teams.B.length})</h4>
      <div class="teams">
        <div class="glass sm"><h4>الفريق A</h4>${t.teams.A.map(n => `<p>${esc(n)}</p>`).join('')}</div>
        <div class="glass sm"><h4>الفريق B</h4>${t.teams.B.map(n => `<p>${esc(n)}</p>`).join('')}</div>
      </div>` : '';
    app.innerHTML = `<button class="back" data-act="back">‹ رجوع</button>
      <div class="glass">
        <h2>${esc(t.name)}</h2>
        <p class="muted">الكود: <b>${esc(s.id)}</b> · ${t.uids.length}/${t.max} لاعب</p>
        ${joined || isOwner ? '' : (full ? '<p class="muted">البطولة ممتلئة</p>' : `<button class="btn" data-act="joinId" data-id="${esc(s.id)}">انضم للبطولة</button>`)}
        ${isOwner && full && !t.teams ? `<button class="btn" data-act="split" data-id="${esc(s.id)}">توزيع الفرق عشوائياً</button>` : ''}
        ${teamsHTML}
        <h4 style="margin-top:14px">اللاعبون</h4>
        ${t.players.map(p => `<p>• ${esc(p.name)}${p.uid === t.owner ? ' <span class="badge">المنظم</span>' : ''}</p>`).join('')}
      </div>`;
  });
}

/* ==== 6) الكلانات ==== */
function clansView() {
  app.innerHTML = `<div class="top">الكلانات</div>
    <div class="glass"><h3>كلان جديد</h3>
      <input id="cn" placeholder="اسم الكلان" maxlength="40">
      <button class="btn" data-act="createC">إنشاء الكلان</button></div>
    <div class="glass"><h3>انضم لكلان بالكود</h3>
      <input id="cj" placeholder="كود الكلان" maxlength="6">
      <button class="btn ghost" data-act="joinC">انضم</button></div>
    <div id="clist" style="padding:0 0 8px"></div>`;
  listen(db.collection('clans').where('uids', 'array-contains', me.uid), s => {
    const list = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const el = document.getElementById('clist');
    if (!el) return;
    el.innerHTML = list.length
      ? list.map(c => `<div class="glass item" data-act="openC" data-id="${esc(c.id)}">
          <h3>${esc(c.name)}</h3>
          <span class="badge">${c.leader === me.uid ? 'أنت القائد' : 'عضو'}</span>
          <span class="badge">${c.uids.length} عضو</span></div>`).join('')
      : `<div class="glass empty muted">لا توجد كلانات بعد</div>`;
  });
}

function cDetail(id) {
  app.innerHTML = `<button class="back" data-act="back">‹ رجوع</button>
    <div class="glass" id="chead"></div>
    <div class="glass"><h3>الدردشة</h3><div id="msgs"></div><div id="cinput"></div></div>`;
  listen(db.collection('clans').doc(id), s => {
    const c = s.data();
    const head = document.getElementById('chead');
    if (!c || !head) return;
    const isLeader = c.leader === me.uid;
    const room = c.room;
    const inRoom = room && room.uids.includes(me.uid);
    head.innerHTML = `<h2>${esc(c.name)}</h2>
      <p class="muted">الكود: <b>${esc(s.id)}</b> · ${c.members.length} عضو</p>
      <h4 style="margin-top:10px">الأعضاء</h4>
      ${c.members.map(m => `<p>• ${esc(m.name)}${m.uid === c.leader ? ' <span class="badge">القائد</span>' : ''}</p>`).join('')}
      <h4 style="margin-top:14px">غرفة الكلان</h4>
      ${room ? `<p><b>${esc(room.name)}</b> · ${room.uids.length} منضم</p>
        ${room.players.map(p => `<p>• ${esc(p.name)}</p>`).join('')}
        ${inRoom ? '' : `<button class="btn ghost" data-act="joinRoom" data-id="${esc(s.id)}">انضم للغرفة</button>`}
        ${isLeader ? `<button class="btn ghost" data-act="closeRoom" data-id="${esc(s.id)}">إغلاق الغرفة</button>` : ''}`
        : (isLeader ? `<button class="btn" data-act="openRoom" data-id="${esc(s.id)}">فتح غرفة جديدة</button>` : '<p class="muted">لا توجد غرفة مفتوحة</p>')}`;
    document.getElementById('cinput').innerHTML = isLeader
      ? `<input id="mtxt" placeholder="اكتب رسالة للكلان" maxlength="300"><button class="btn" data-act="send" data-id="${esc(s.id)}">إرسال</button>`
      : '<p class="muted">القائد فقط يستطيع الكتابة</p>';
  });
  listen(db.collection('clans').doc(id).collection('messages').orderBy('at', 'asc').limitToLast(50), s => {
    const el = document.getElementById('msgs');
    if (!el) return;
    el.innerHTML = s.docs.length
      ? s.docs.map(d => { const m = d.data(); return `<div class="msg"><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`; }).join('')
      : '<p class="muted">لا توجد رسائل بعد</p>';
    el.scrollTop = el.scrollHeight;
  });
}

/* ==== 7) حسابي ==== */
let pendingPhoto = null;

function profileView() {
  pendingPhoto = null;
  app.innerHTML = `<div class="glass" id="pcard"></div>`;
  listen(db.collection('users').doc(me.uid), s => {
    const u = s.data() || {};
    const photo = u.photo || me.photoURL || '';
    const name = u.name || me.displayName || 'Apex_hz_08';
    const username = u.username || '';
    const el = document.getElementById('pcard');
    if (!el) return;
    el.innerHTML = `<div class="empty" style="padding-top:8px">
        ${photo ? `<img src="${esc(photo)}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--stroke)">` : '<div style="font-size:64px">🎮</div>'}
        <h2>${esc(name)}</h2>
        <p class="muted">${username ? '@' + esc(username) : 'لم تختر يوزراً بعد'}</p>
        <p class="muted">${esc(me.email || '')}</p>
      </div>
      <label class="btn ghost" style="display:block;text-align:center;cursor:pointer">تغيير الصورة
        <input type="file" accept="image/*" id="pf" style="display:none"></label>
      <h4 style="margin-top:14px">الاسم</h4>
      <input id="pn" placeholder="اسمك" maxlength="30" value="${esc(name)}">
      <h4 style="margin-top:8px">اليوزر</h4>
      <input id="pu" placeholder="مثال: Apex_hz_08" maxlength="20" value="${esc(username)}">
      <button class="btn" data-act="saveProfile">حفظ التغييرات</button>
      <button class="btn ghost" data-act="changePass">تغيير كلمة السر</button>
      <button class="btn ghost" data-act="toggleLang">${lang === 'ar' ? '🌐 Langue : Français' : '🌐 اللغة: العربية'}</button>
      <button class="btn ghost" data-act="contactDev">تواصل مع المطور</button>
      <button class="btn ghost" data-act="logout">تسجيل الخروج</button>`;
  });
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const S = 160;
        const s = S / Math.min(img.width, img.height);
        const c = document.createElement('canvas');
        c.width = c.height = S;
        const w = img.width * s, h = img.height * s;
        c.getContext('2d').drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function authMsg(e) {
  const m = {
    'auth/invalid-email': 'البريد الإلكتروني غير صالح',
    'auth/missing-password': 'أدخل كلمة السر',
    'auth/invalid-credential': 'البريد أو كلمة السر غير صحيحة',
    'auth/wrong-password': 'كلمة السر غير صحيحة',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
    'auth/email-already-in-use': 'هذا البريد مسجل بالفعل',
    'auth/weak-password': 'كلمة السر ضعيفة (6 أحرف على الأقل)',
    'auth/too-many-requests': 'محاولات كثيرة، انتظر قليلاً ثم حاول مجدداً'
  };
  return m[e.code] || e.message;
}

/* ==== 8) الأحداث ==== */
const handlers = {
  login: async () => {
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) return toast('أدخل البريد وكلمة السر');
    try { await auth.signInWithEmailAndPassword(email, pw); }
    catch (e) { toast(authMsg(e)); }
  },
  register: async () => {
    const name = document.getElementById('nm').value.trim();
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!name) return toast('اكتب اسمك في الحقل الأول');
    if (!email) return toast('أدخل البريد الإلكتروني');
    if (pw.length < 6) return toast('كلمة السر يجب أن تكون 6 أحرف على الأقل');
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      await cred.user.updateProfile({ displayName: name });
      render();
    } catch (e) { toast(authMsg(e)); }
  },
  logout: () => auth.signOut(),

  changePass: async () => {
    try {
      await auth.sendPasswordResetEmail(me.email);
      toast('تم إرسال رسالة التحقق إلى بريدك الإلكتروني. افتح الرابط لتعيين كلمة سر جديدة');
    } catch (e) { toast(authMsg(e)); }
  },

  toggleLang: () => {
    lang = lang === 'ar' ? 'fr' : 'ar';
    try { localStorage.setItem('lang', lang); } catch (e) {}
    applyDir();
    render();
  },

  contactDev: () => window.open('https://www.tiktok.com/@apexhz08', '_blank'),

  saveProfile: async () => {
    const name = document.getElementById('pn').value.trim();
    const username = document.getElementById('pu').value.trim().replace(/^@/, '');
    if (!name) return toast('اكتب اسمك');
    if (username && !/^[A-Za-z0-9_.]{3,20}$/.test(username))
      return toast('اليوزر: أحرف إنجليزية وأرقام و _ فقط (من 3 إلى 20)');
    const data = { name, username };
    if (pendingPhoto) data.photo = pendingPhoto;
    try {
      await db.collection('users').doc(me.uid).set(data, { merge: true });
      await me.updateProfile({ displayName: name });
      pendingPhoto = null;
      toast('تم حفظ التغييرات');
      render();
    } catch (e) { toast(e.message); }
  },
  tab: el => { view.tab = el.dataset.tab; view.detail = null; render(); },
  back: () => { view.detail = null; render(); },
  openT: el => { view.detail = { type: 't', id: el.dataset.id }; render(); },
  openC: el => { view.detail = { type: 'c', id: el.dataset.id }; render(); },

  createT: async () => {
    const name = document.getElementById('tn').value.trim();
    const max = parseInt(document.getElementById('tm').value, 10);
    if (!name) return toast('اكتب اسم البطولة');
    if (!(max >= 4 && max <= 12 && max % 2 === 0)) return toast('عدد اللاعبين يجب أن يكون زوجياً بين 4 و 12');
    const id = newCode();
    const player = { uid: me.uid, name: me.displayName || 'لاعب' };
    await db.collection('tournaments').doc(id).set({
      name, max, owner: me.uid, players: [player], uids: [me.uid], teams: null, createdAt: FV.serverTimestamp()
    });
    view.detail = { type: 't', id }; render();
  },

  joinT: () => joinTournament(document.getElementById('jc').value.trim().toUpperCase()),
  joinId: el => joinTournament(el.dataset.id),

  split: async el => {
    const ref = db.collection('tournaments').doc(el.dataset.id);
    const snap = await ref.get();
    const t = snap.data();
    if (!t || t.teams) return;
    const shuffled = shuffle(t.players.map(p => p.name));
    const half = t.max / 2;
    await ref.update({ teams: { A: shuffled.slice(0, half), B: shuffled.slice(half) } });
  },

  createC: async () => {
    const name = document.getElementById('cn').value.trim();
    if (!name) return toast('اكتب اسم الكلان');
    const id = newCode();
    const member = { uid: me.uid, name: me.displayName || 'لاعب' };
    await db.collection('clans').doc(id).set({
      name, leader: me.uid, members: [member], uids: [me.uid], room: null, createdAt: FV.serverTimestamp()
    });
    view.detail = { type: 'c', id }; render();
  },

  joinC: async () => {
    const id = document.getElementById('cj').value.trim().toUpperCase();
    if (!id) return;
    const ref = db.collection('clans').doc(id);
    try {
      await db.runTransaction(async tx => {
        const c = (await tx.get(ref)).data();
        if (!c) throw new Error('لا يوجد كلان بهذا الكود');
        if (c.uids.includes(me.uid)) return;
        tx.update(ref, {
          uids: FV.arrayUnion(me.uid),
          members: FV.arrayUnion({ uid: me.uid, name: me.displayName || 'لاعب' })
        });
      });
      view.detail = { type: 'c', id }; render();
    } catch (e) { toast(e.message); }
  },

  openC: el => { view.detail = { type: 'c', id: el.dataset.id }; render(); },

  openRoom: async el => {
    const name = await askText('اسم الغرفة (مثال: تدريب الليلة 8 مساءً)');
    if (!name) return;
    await db.collection('clans').doc(el.dataset.id).update({
      room: { name: name.slice(0, 40), uids: [], players: [] }
    });
  },

  joinRoom: async el => {
    const ref = db.collection('clans').doc(el.dataset.id);
    await db.runTransaction(async tx => {
      const c = (await tx.get(ref)).data();
      if (!c || !c.room || c.room.uids.includes(me.uid)) return;
      tx.update(ref, {
        'room.uids': FV.arrayUnion(me.uid),
        'room.players': FV.arrayUnion({ uid: me.uid, name: me.displayName || 'لاعب' })
      });
    });
  },

  closeRoom: el => db.collection('clans').doc(el.dataset.id).update({ room: null }),

  send: async el => {
    const input = document.getElementById('mtxt');
    const text = input.value.trim();
    if (!text) return;
    const ref = db.collection('clans').doc(el.dataset.id);
    const c = (await ref.get()).data();
    if (!c || c.leader !== me.uid) return; // القائد فقط
    await ref.collection('messages').add({ text, name: me.displayName || 'القائد', at: FV.serverTimestamp() });
    input.value = '';
  }
};

async function joinTournament(id) {
  if (!id) return toast('أدخل كود البطولة');
  const ref = db.collection('tournaments').doc(id);
  try {
    await db.runTransaction(async tx => {
      const t = (await tx.get(ref)).data();
      if (!t) throw new Error('لا توجد بطولة بهذا الكود');
      if (t.uids.includes(me.uid)) return;
      if (t.uids.length >= t.max) throw new Error('البطولة ممتلئة');
      tx.update(ref, {
        uids: FV.arrayUnion(me.uid),
        players: FV.arrayUnion({ uid: me.uid, name: me.displayName || 'لاعب' })
      });
    });
    view.detail = { type: 't', id }; render();
  } catch (e) { toast(e.message); }
}

function applyDir() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fr' ? 'ltr' : 'rtl';

function translateTree(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const k = n.nodeValue.trim();
    if (FR[k]) n.nodeValue = n.nodeValue.replace(k, FR[k]);
  }
  root.querySelectorAll('[placeholder]').forEach(el => {
    const k = el.getAttribute('placeholder');
    if (FR[k]) el.setAttribute('placeholder', FR[k]);
  });
}
new MutationObserver(() => { if (lang === 'fr') translateTree(document.body); })
  .observe(document.body, { childList: true, subtree: true });

async function mutateT(id, fn) {
  const ref = db.collection('tournaments').doc(id);
  try {
    await db.runTransaction(async tx => {
      const t = (await tx.get(ref)).data();
      if (!t) throw new Error('البطولة غير موجودة');
      const patch = fn(t);
      if (!patch) return;
      if (patch.entries && (t.banned || []).includes(me.uid)) throw new Error('أنت محظور من هذه البطولة');
      if (patch.entries) patch.uids = uidsOf(patch.entries, t.owner);
      tx.update(ref, patch);
    });
    return true;
  } catch (e) { toast(e.message); return false; }
}

function advanceInto(ms, m) {
  const nx = ms.find(x => x.r === m.r + 1 && x.i === Math.floor(m.i / 2));
  if (!nx) return;
  if (m.i % 2 === 0) nx.a = m.w; else nx.b = m.w;
}

function buildBracket(entries) {
  const list = shuffle(entries.map(e => ({ id: e.id, name: e.name })));
  let N = 1; while (N < list.length) N *= 2;
  const R = Math.round(Math.log2(N));
  const byes = N - list.length;
  const ms = [];
  for (let r = 0; r < R; r++)
    for (let i = 0; i < N / 2 ** (r + 1); i++) ms.push({ r, i, a: null, b: null, w: null, at: null });
  let k = 0;
  for (let i = 0; i < N / 2; i++) { ms[i].a = list[k++]; if (i >= byes) ms[i].b = list[k++]; }
  ms.slice(0, N / 2).forEach(m => { if (m.a && !m.b) { m.w = m.a; advanceInto(ms, m); } });
  return ms;
}

const entryHTML = (e, id, t, isOwner, squad) => `
  <div class="glass sm">
    <h4>${squad ? '🛡️ ' + esc(e.name) + ' <span class="chip" style="cursor:default">كود: ' + esc(e.id) + '</span>' : '🎮 ' + esc(e.name)}</h4>
    ${e.members.map(m => `<p>• ${esc(m.name)}
      ${squad && m.uid === e.leader ? '<span class="chip" style="cursor:default">القائد</span>' : ''}
      ${isOwner && m.uid !== t.owner ? `<button class="chip" data-act="kick" data-id="${esc(id)}" data-uid="${esc(m.uid)}">${squad && m.uid === e.leader ? 'طرد السكواد' : 'طرد'}</button><button class="chip" data-act="ban" data-id="${esc(id)}" data-uid="${esc(m.uid)}">حظر</button>` : ''}</p>`).join('')}
  </div>`;

function bracketHTML(t, id, isOwner) {
  if (!t.matches || !t.matches.length) return '<p class="muted">لا يوجد جدول</p>';
  const R = Math.max(...t.matches.map(m => m.r)) + 1;
  const label = r => r === R - 1 ? 'النهائي' : (r === R - 2 && R > 2) ? 'نصف النهائي' : 'الدور ' + (r + 1);
  const row = (e, side, m, idx, playable) => {
    const won = m.w && e && m.w.id === e.id;
    const click = playable && e ? `data-act="win" data-id="${esc(id)}" data-i="${idx}" data-s="${side}"` : '';
    return `<div class="mrow ${won ? 'win' : ''}" ${click}>${e ? esc(e.name) : '…'}</div>`;
  };
  const final = t.matches.find(m => m.r === R - 1);
  let out = final && final.w ? `<p style="margin-bottom:10px">🏆 البطل: <b>${esc(final.w.name)}</b></p>` : '';
  out += '<div class="bracket">';
  for (let r = 0; r < R; r++) {
    out += `<div class="round"><h4>${label(r)}</h4>`;
    t.matches.forEach((m, idx) => {
      if (m.r !== r) return;
      const bye = r === 0 && m.a && !m.b;
      const playable = m.a && m.b && !m.w;
      out += `<div class="mcard">
        ${row(m.a, 'a', m, idx, isOwner && playable)}
        ${bye ? '<div class="mrow muted">تأهل مباشر</div>' : row(m.b, 'b', m, idx, isOwner && playable)}
        <div class="muted" style="font-size:12px">${m.at ? esc(fmtAt(m.at)) : 'بدون موعد'}</div>
        ${isOwner && !bye ? `<input type="datetime-local" id="at-${idx}" value="${toLocalInput(m.at)}">
          <button class="chip" data-act="setAt" data-id="${esc(id)}" data-i="${idx}">حفظ الموعد</button>` : ''}
      </div>`;
    });
    out += '</div>';
  }
  return out + '</div>';
}

function tDetail(id) {
  listen(db.collection('tournaments').doc(id), s => {
    const t = s.data();
    if (!t) { app.innerHTML = `<button class="back" data-act="back">‹ رجوع</button><div class="glass empty">البطولة غير موجودة</div>`; return; }
    const M = MODES[t.mode];
    const isOwner = t.owner === me.uid;
    const joined = t.uids.includes(me.uid);
    const open = t.status === 'open';
    const squad = M.size > 1;
    const full = t.entries.length >= M.max;
    let html = `<button class="back" data-act="back">‹ رجوع</button>
      <div class="glass">
        <h2>${esc(t.name)}</h2>
        <p class="muted">${M.label} · الكود: <b>${esc(s.id)}</b></p>
        ${t.at ? `<p class="muted">الموعد: ${esc(fmtAt(t.at))}</p>` : ''}
        <p class="muted">${open ? 'مفتوحة للتسجيل' : 'البطولة جارية'} · ${t.entries.length}/${M.max} ${squad ? 'سكواد' : 'لاعب'}</p>`;
    if (open) {
      html += `<h4 style="margin-top:12px">${squad ? 'السكوادات' : 'اللاعبون'}</h4>`;
      html += t.entries.length ? t.entries.map(e => entryHTML(e, s.id, t, isOwner, squad)).join('') : '<p class="muted">لا يوجد مسجلون بعد</p>';
      if (!joined && !full && !isOwner) {
        html += squad
          ? `<input id="sqn" placeholder="اسم السكواد الجديد" maxlength="20">
             <button class="btn" data-act="createSquad" data-id="${esc(s.id)}">إنشاء سكواد</button>
             <input id="sqc" placeholder="كود سكواد للانضمام" maxlength="6">
             <button class="btn ghost" data-act="joinSquad" data-id="${esc(s.id)}">انضم لسكواد</button>`
          : `<button class="btn" data-act="joinSolo" data-id="${esc(s.id)}">انضم للبطولة</button>`;
      }
      if (joined && !isOwner) html += `<button class="btn ghost" data-act="leave" data-id="${esc(s.id)}">الخروج من البطولة</button>`;
      if (isOwner) html += `<button class="btn" data-act="start" data-id="${esc(s.id)}">بدء البطولة</button>`;
    }
    html += `</div>`;
    if (!open) html += `<div class="glass"><h3>الجدول</h3>${bracketHTML(t, s.id, isOwner)}</div>`;
    app.innerHTML = html;
  });
}

Object.assign(handlers, {
  createT: async () => {
    const name = document.getElementById('tn').value.trim();
    const mode = document.getElementById('tmode').value;
    const plays = document.getElementById('tplay').value === 'yes';
    const at = document.getElementById('tat').value;
    if (!name) return toast('اكتب اسم البطولة');
    const id = newCode();
    let entries = [];
    if (plays) {
      const mem = { uid: me.uid, name: meName() };
      entries = [mode === 'solo'
        ? { id: me.uid, name: meName(), leader: me.uid, members: [mem] }
        : { id: newCode(), name: 'سكواد ' + meName(), leader: me.uid, members: [mem] }];
    }
    await db.collection('tournaments').doc(id).set({
      name, mode, owner: me.uid, ownerPlays: plays,
      at: at ? new Date(at).toISOString() : null,
      entries, uids: uidsOf(entries, me.uid), status: 'open', matches: [],
      createdAt: FV.serverTimestamp()
    });
    view.detail = { type: 't', id }; render();
  },

  joinT: async () => {
    const id = document.getElementById('jc').value.trim().toUpperCase();
    if (!id) return toast('أدخل كود البطولة');
    const snap = await db.collection('tournaments').doc(id).get();
    if (!snap.exists) return toast('لا توجد بطولة بهذا الكود');
    view.detail = { type: 't', id }; render();
  },

  joinSolo: async el => {
    const ok = await mutateT(el.dataset.id, t => {
      if (t.status !== 'open') throw new Error('البطولة بدأت');
      if (t.uids.includes(me.uid)) return null;
      if (t.entries.length >= MODES[t.mode].max) throw new Error('البطولة ممتلئة');
      return { entries: [...t.entries, { id: me.uid, name: meName(), leader: me.uid, members: [{ uid: me.uid, name: meName() }] }] };
    });
    if (ok) toast('تم تسجيلك في البطولة');
  },

  createSquad: async el => {
    const name = document.getElementById('sqn').value.trim() || ('سكواد ' + meName());
    const ok = await mutateT(el.dataset.id, t => {
      if (t.status !== 'open') throw new Error('البطولة بدأت');
      if (t.uids.includes(me.uid)) throw new Error('أنت مسجل بالفعل');
      if (t.entries.length >= MODES[t.mode].max) throw new Error('عدد السكوادات مكتمل');
      return { entries: [...t.entries, { id: newCode(), name, leader: me.uid, members: [{ uid: me.uid, name: meName() }] }] };
    });
    if (ok) toast('تم إنشاء السكواد. شارك كوده مع أعضائه');
  },

  joinSquad: async el => {
    const code = document.getElementById('sqc').value.trim().toUpperCase();
    const ok = await mutateT(el.dataset.id, t => {
      if (t.status !== 'open') throw new Error('البطولة بدأت');
      if (t.uids.includes(me.uid)) throw new Error('أنت مسجل بالفعل');
      const sq = t.entries.find(e => e.id === code);
      if (!sq) throw new Error('لا يوجد سكواد بهذا الكود');
      if (sq.members.length >= MODES[t.mode].size) throw new Error('السكواد مكتمل');
      return { entries: t.entries.map(e => e.id === code ? { ...e, members: [...e.members, { uid: me.uid, name: meName() }] } : e) };
    });
    if (ok) toast('تم انضمامك للسكواد');
  },

  leave: async el => {
    const ok = await mutateT(el.dataset.id, t => {
      if (t.status !== 'open') throw new Error('لا يمكن الخروج بعد بدء البطولة');
      const mine = t.entries.find(e => e.members.some(m => m.uid === me.uid));
      if (!mine) return null;
      if (mine.leader === me.uid && mine.members.length > 1) throw new Error('قائد السكواد لا يخرج والسكواد فيه أعضاء');
      return { entries: t.entries.map(e => ({ ...e, members: e.members.filter(m => m.uid !== me.uid) })).filter(e => e.members.length > 0) };
    });
    if (ok) toast('تم خروجك من البطولة');
  },

  kick: async el => {
    const uid = el.dataset.uid;
    await mutateT(el.dataset.id, t => {
      if (t.status !== 'open') throw new Error('لا يمكن الطرد بعد بدء البطولة');
      if (uid === t.owner) throw new Error('لا يمكن طرد المنظم');

function bracketHTML(t, id, isOwner) {
  if (!t.matches || !t.matches.length) return '<p class="muted">لا يوجد جدول</p>';
  const R = Math.max(...t.matches.map(m => m.r)) + 1;
  const label = r => r === R - 1 ? 'النهائي' : (r === R - 2 && R > 2) ? 'نصف النهائي' : 'الدور ' + (r + 1);
  const row = (e, side, m, idx, playable) => {
    const won = !!(m.w && e && m.w.id === e.id);
    const lost = !!(m.w && e && !won);
    let right = '';
    if (won) right = '<span class="chip" style="cursor:default">🏆 فائز</span>';
    else if (playable && e) right = `<button class="chip" data-act="win" data-id="${esc(id)}" data-i="${idx}" data-s="${side}">فائز</button>`;
    let scoreHTML = '';
    if (playable && e) scoreHTML = `<input type="number" min="0" class="score" id="sc-${idx}-${side}" placeholder="0">`;
    else if (m.w && e && m.sa != null) scoreHTML = `<b>${side === 'a' ? m.sa : m.sb}</b>`;
    return `<div class="mrow ${won ? 'win' : ''} ${lost ? 'lose' : ''}"><span>${e ? esc(e.name) : '…'}</span><span class="mright">${scoreHTML}${right}</span></div>`;
  };
  const final = t.matches.find(m => m.r === R - 1);
  let out = final && final.w ? `<p style="margin-bottom:10px">🏆 البطل: <b>${esc(final.w.name)}</b></p>` : '';
  out += '<div class="bracket">';
  for (let r = 0; r < R; r++) {
    out += `<div class="round"><h4>${label(r)}</h4>`;
    t.matches.forEach((m, idx) => {
      if (m.r !== r) return;
      const bye = r === 0 && m.a && !m.b;
      const playable = !!(m.a && m.b && !m.w);
      out += `<div class="mcard">
        ${row(m.a, 'a', m, idx, isOwner && playable)}
        ${bye ? '<div class="mrow muted">تأهل مباشر</div>' : row(m.b, 'b', m, idx, isOwner && playable)}
        <div class="muted" style="font-size:12px;margin-top:6px">${m.at ? esc(fmtAt(m.at)) : 'بدون موعد'}</div>
        ${isOwner && !bye ? `<input type="datetime-local" id="at-${idx}" value="${toLocalInput(m.at)}">
          <button class="chip" data-act="setAt" data-id="${esc(id)}" data-i="${idx}">حفظ الموعد</button>` : ''}
      </div>`;
    });
    out += '</div>';
  }
  return out + '</div>';
}

function askDialog({ text, input = false, ok = 'تأكيد', cancel = 'إلغاء' }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = `<div class="dlg"><p>${esc(text)}</p>
      ${input ? '<input id="dlgIn" maxlength="40">' : ''}
      <div class="row"><button class="btn ghost" id="dlgNo">${cancel}</button><button class="btn" id="dlgYes">${ok}</button></div></div>`;
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelector('#dlgNo').onclick = () => done(input ? null : false);
    ov.querySelector('#dlgYes').onclick = () => done(input ? (ov.querySelector('#dlgIn').value.trim() || null) : true);
    if (input) setTimeout(() => ov.querySelector('#dlgIn').focus(), 50);
  });
}

const askText = text => askDialog({ text, input: true, ok: 'حفظ' });

const _cdBase = cDetail;
cDetail = function (id) {
  _cdBase(id);
  document.getElementById('chead').insertAdjacentHTML('afterend', '<div class="glass" id="warBox" style="display:none"></div>');
  listen(db.collection('clans').doc(id), s => {
    const c = s.data(), box = document.getElementById('warBox');
    if (!box || !c) return;
    const isLeader = c.leader === me.uid;
    box.style.display = isLeader ? '' : 'none';
    box.innerHTML = isLeader
      ? `<h3>حروب الرابطة</h3><p class="muted">أرسل إشعاراً لكل أعضاء الكلان</p>

      : '';

/* ==== إدارة الكلان: الأعضاء، المساعدون، الطرد، الخروج ==== */
const _cdPrev = cDetail;
cDetail = function (id) {
  _cdPrev(id);
  document.getElementById('chead').insertAdjacentHTML('afterend', '<div class="glass" id="mgmtBox"></div>');
  listen(db.collection('clans').doc(id), s => {
    const c = s.data(), box = document.getElementById('mgmtBox');
    if (!c) {
      if (view.detail && view.detail.type === 'c' && view.detail.id === id) {
        view.detail = null; render(); toast('تم إغلاق هذا الكلان');
      }
      return;
    }
    if (!box) return;
    const assistants = c.assistants || [];
    const role = c.leader === me.uid ? 'leader' : assistants.includes(me.uid) ? 'assistant' : 'member';
    const rows = c.members.map(m => {
      const isLead = m.uid === c.leader, isAss = assistants.includes(m.uid), isMe = m.uid === me.uid;
      const label = isLead ? 'القائد' : isAss ? 'مساعد' : 'عضو';
      let btns = '';
      if (!isMe && !isLead) {
        if (role === 'leader') {
          btns += isAss
            ? `<button class="chip" data-act="demote" data-id="${esc(id)}" data-uid="${esc(m.uid)}">إزالة المساعد</button>`
            : `<button class="chip" data-act="promote" data-id="${esc(id)}" data-uid="${esc(m.uid)}">ترقية لمساعد</button>`;
        }
        if ((role === 'leader' || role === 'assistant') && !(role === 'assistant' && isAss)) {
          btns += `<button class="chip" data-act="clanKick" data-id="${esc(id)}" data-uid="${esc(m.uid)}">طرد</button>`;
        }
      }
      return `<p>• ${esc(m.name)} <span class="chip" style="cursor:default">${label}</span> ${btns}</p>`;
    }).join('');
    const leave = role === 'leader'
      ? `<button class="btn" style="background:linear-gradient(135deg,#7a0019,#ff2e63)" data-act="closeClan" data-id="${esc(id)}">🔒 إغلاق الكلان نهائياً</button>`
      : `<button class="btn ghost" data-act="clanLeave" data-id="${esc(id)}">الخروج من الكلان</button>`;
    box.innerHTML = `<h3>الأعضاء (${c.members.length}) · المساعدون ${assistants.length}/2</h3>${rows}${leave}`;
  });
};

async function mutateC(id, fn) {
  const ref = db.collection('clans').doc(id);
  try {
    await db.runTransaction(async tx => {
      const c = (await tx.get(ref)).data();
      if (!c) throw new Error('الكلان غير موجود');
      const patch = fn(c);
      if (!patch) return;
      patch.uids = [...new Set(patch.members.map(m => m.uid))];
      tx.update(ref, patch);
    });
    return true;
  } catch (e) { toast(e.message); return false; }
}

Object.assign(handlers, {
  promote: async el => {
    const uid = el.dataset.uid;
    const ok = await mutateC(el.dataset.id, c => {
      if (c.leader !== me.uid) throw new Error('القائد فقط يرقّي المساعدين');
      const a = c.assistants || [];
      if (a.includes(uid)) return null;
      if (a.length >= 2) throw new Error('الحد الأقصى للمساعدين مساعدان');
      return { assistants: [...a, uid], members: c.members };
    });
    if (ok) toast('تمت ترقيته إلى مساعد');
  },

  demote: async el => {
    const uid = el.dataset.uid;
    const ok = await mutateC(el.dataset.id, c => {
      if (c.leader !== me.uid) throw new Error('القائد فقط');
      return { assistants: (c.assistants || []).filter(x => x !== uid), members: c.members };
    });
    if (ok) toast('تمت إزالة المساعد');
  },

  clanKick: async el => {
    const uid = el.dataset.uid;
    if (!(await askConfirm('هل تريد طرد هذا العضو من الكلان؟'))) return;
    await mutateC(el.dataset.id, c => {
      const a = c.assistants || [];
      const myRole = c.leader === me.uid ? 'leader' : a.includes(me.uid) ? 'assistant' : null;
      if (!myRole) throw new Error('ليست لديك صلاحية الطرد');
      if (uid === c.leader) throw new Error('لا يمكن طرد القائد');
      if (myRole === 'assistant' && a.includes(uid)) throw new Error('المساعد لا يطرد مساعداً آخر');
      return {
        members: c.members.filter(m => m.uid !== uid),
        assistants: a.filter(x => x !== uid)
      };
    });
  },

  clanLeave: async el => {
    if (!(await askConfirm('هل تريد تأكيد الخروج من الكلان؟'))) return;
    const ok = await mutateC(el.dataset.id, c => {
      if (c.leader === me.uid) throw new Error('القائد لا يستطيع الخروج من كلانه');
      return {
        members: c.members.filter(m => m.uid !== me.uid),
        assistants: (c.assistants || []).filter(x => x !== me.uid)
      };
    });
    if (ok) { view.detail = null; render(); toast('تم خروجك من الكلان'); }
  }
});

Object.assign(handlers, {
  closeClan: async el => {
    const id = el.dataset.id;
    const ref = db.collection('clans').doc(id);
    const c = (await ref.get()).data();
    if (!c || c.leader !== me.uid) return toast('القائد فقط يستطيع إغلاق الكلان');
    if (!(await askConfirm('هل تريد إغلاق الكلان نهائياً؟ سيخرج جميع الأعضاء منه وتُحذف رسائله، ولا يمكن التراجع'))) return;
    try {
      const msgs = await ref.collection('messages').get();
      const alerts = await db.collection('alerts').where('clanId', '==', id).get();
      const batch = db.batch();
      msgs.docs.forEach(d => batch.delete(d.ref));
      alerts.docs.forEach(d => batch.delete(d.ref));
      batch.delete(ref);
      await batch.commit();
      toast('تم إغلاق الكلان وحذفه');
    } catch (e) { toast('تعذر الإغلاق: ' + e.message); }
  }
});

function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, icon: 'icon.svg', badge: 'icon.svg', vibrate: [200, 100, 200], tag: 'ff-alert' };
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts)).catch(() => {});
  } else {
    try { new Notification(title, opts); } catch (e) {}
  }
}

function showAlert(a) {
  const el = document.createElement('div');
  el.className = 'alertx';
  el.innerHTML = `<b>🔔 ${esc(a.clanName)}</b><div style="margin-top:4px">${esc(a.text)}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 8000);
  notify(a.clanName, a.text);
}

let alertsStarted = false;
function startAlerts(uid) {
  if (alertsStarted) return;
  alertsStarted = true;
  let since;
  try { since = localStorage.getItem('alertsSince') || new Date(0).toISOString(); } catch (e) { since = new Date(0).toISOString(); }
  db.collection('alerts').where('uids', 'array-contains', uid).onSnapshot(s => {
    s.docChanges().forEach(c => {
      if (c.type !== 'added') return;
      const a = c.doc.data();
      if (a.at > since) showAlert(a);
    });
    since = new Date().toISOString();
    try { localStorage.setItem('alertsSince', since); } catch (e) {}
  });
}
auth.onAuthStateChanged(u => { if (u) startAlerts(u.uid); });

Object.assign(handlers, {

    });

});
